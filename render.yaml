services:
  - type: web
    name: finmind-api
    env: node
    plan: free
    buildCommand: npx prisma generate && npx prisma migrate resolve --rolled-back 20260430205500_init || true && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
