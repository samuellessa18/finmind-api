# ──────────────────────────────────────────────────────────────
# FinMind API — render.yaml
# [FASE 7] Sincronizado com o painel real do Render.
#
# IMPORTANTE: o painel do Render é a fonte de verdade. Este arquivo
# documenta a configuração esperada. Drift entre painel e arquivo é
# checkado manualmente (sem reconciliação automática).
#
# Histórico:
#  - REMOVIDO: npx prisma db push --accept-data-loss (DESTRUTIVO)
#  - REMOVIDO: node prisma-nuclear-fix.js
#  - ADICIONADO: scripts/prisma-baseline.js (idempotente, fase 1)
#  - ADICIONADO: --schema=./prisma/schema.prisma (fase de baseline)
#  - ADICIONADO: SENTRY_DSN/ENVIRONMENT/RELEASE (fase 4)
# ──────────────────────────────────────────────────────────────

services:
  - type: web
    name: finmind-api
    env: node
    plan: free  # Considerar upgrade para eliminar cold start
    region: oregon

    # Build command — espelha exatamente o painel Render.
    # npm install (não npm ci) por compatibilidade com regen de lockfile do npm audit fix.
    # Trocar para npm ci após validar que lockfile no repo é sempre commitado.
    buildCommand: npm install && npx prisma generate --schema=./prisma/schema.prisma && node scripts/prisma-baseline.js && npx prisma migrate deploy --schema=./prisma/schema.prisma

    startCommand: node src/server.js
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Configurar manualmente no painel do Render
      - key: JWT_SECRET
        sync: false   # Gerar: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID_WEB
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GOOGLE_CLIENT_ID_ANDROID
        sync: false
      - key: GOOGLE_CLIENT_ID_IOS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false   # Gerar: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: GROWTH_ROLLOUT_PERCENTAGE
        value: "10"

      # [FASE 4] Observabilidade — opcional. Sem DSN, Sentry no-op.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_RELEASE
        sync: false   # Pode usar git SHA via auto-set
