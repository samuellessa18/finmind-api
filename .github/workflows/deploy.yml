name: Backend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db" # Mock URL for client generation

      - name: Syntax Check
        run: node -c src/server.js

  health-check:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Deploy (60s)
        run: sleep 60

      - name: API Health Check
        run: |
          API_URL="https://finmind-api.onrender.com/api/health"
          echo "Pinging $API_URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" $API_URL)
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ API Health Check failed with status $STATUS"
            exit 1
          else
            echo "✅ API is Healthy!"
          fi
